[project]
name = "alfa-xakaton_2026"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.161.1",
    "uvicorn[standard]==0.54.0",
    "pydantic==2.14.1",
    "pydantic-settings==2.16.1",
    "openai==3.37.0",
    "python-json-logger==4.2.0",
    "python-dotenv==1.2.4",
]

[project.optional-dependencies]
dev = ["pytest==9.1.1", "pytest-asyncio==1.4.0", "ruff==0.17.2", "httpx==0.28.1"]

[tool.ruff]
line-length = 100
target-version = "py311"